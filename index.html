<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ชู้ตเทพแรงโน้มถ่วง</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;800&family=Pixelify+Sans:wght@700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05071a;font-family:"Pixelify Sans","Kanit",Tahoma,sans-serif;color:#fff}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);z-index:5}
  video{display:none}
  .card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:min(900px,90vw);max-height:92vh;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:26px;background:#1a1340;color:#fff;border:6px solid #fff;outline:6px solid #000;box-shadow:16px 16px 0 #000}
  .card h1{margin:0;line-height:0}
  .card h1 canvas{position:static;width:auto;height:auto}
  .card p{font-size:clamp(17px,2vw,24px);margin:0;line-height:1.45}
  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
  button{font:inherit;font-family:"Kanit",Tahoma,sans-serif;font-size:clamp(18px,2.1vw,26px);padding:10px 24px;border:4px solid #000;border-radius:0;cursor:pointer;background:#ffcf33;color:#000;font-weight:800;box-shadow:inset -5px -5px 0 rgba(0,0,0,.3),inset 5px 5px 0 rgba(255,255,255,.5),6px 6px 0 #000}
  button:active{transform:translate(4px,4px);box-shadow:inset 5px 5px 0 rgba(0,0,0,.3),2px 2px 0 #000}
  button.blue{background:#4fd7ff} button.pink{background:#ff5fa2}
  button.tog{font-size:clamp(15px,1.6vw,20px);padding:8px 16px;background:#c9c3e6;box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),4px 4px 0 #000}
  button.tog.on{background:#7be39a}
  .card p,.label,.lbtitle,table{font-family:"Kanit",Tahoma,sans-serif}
  button.small{font-size:18px;padding:8px 18px}
  .label{font-weight:700;font-size:18px}
  input{font:inherit;font-size:24px;padding:10px 14px;border:4px solid #000;border-radius:0;width:min(320px,60vw);background:#fff;color:#000;font-family:"Kanit",Tahoma,sans-serif}
  table{border-collapse:collapse;font-size:clamp(15px,1.6vw,20px);min-width:min(460px,80vw)}
  th,td{padding:4px 12px;border-bottom:2px dashed #5a4f9a}
  th{border-bottom:4px solid #fff;color:#ffcf33}
  tr.me td{background:#ffcf33;color:#000;font-weight:800}
  .lbtitle{font-weight:700;font-size:20px;margin-top:4px}
  .hidden{display:none!important}
  .legend span{font-family:Kanit,Tahoma,sans-serif;font-weight:800;padding:6px 14px;border:4px solid #000;color:#fff;font-size:clamp(15px,1.7vw,20px)}
  #status{font-size:16px;color:#a9a2d6;font-family:"Kanit",Tahoma,sans-serif}
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="c"></canvas>
<canvas id="u"></canvas>

<div id="start" class="card">
  <h1>ชู้ตเทพแรงโน้มถ่วง!</h1>
  <p><b>แตะลูกบอล</b> แล้ว <b>สะบัดมือขึ้นไปทางขวา</b> เพื่อโยนลงห่วง<br>แต่ละดาวมีแรงโน้มถ่วงไม่เท่ากัน ลูกบอลจะลอยไม่เหมือนกันนะ!</p>
  <div class="row">
    <span class="label">เลือกลูก:</span>
    <button id="ball0" class="tog" onclick="setBall(0)">ปิงปอง (เบา)</button>
    <button id="ball1" class="tog on" onclick="setBall(1)">บาสเกตบอล</button>
    <button id="ball2" class="tog" onclick="setBall(2)">โบว์ลิ่ง (หนัก)</button>
  </div>
  <div class="row">
    <button class="blue" onclick="startGame('solo')">เล่นคนเดียว</button>
    <button class="pink" onclick="startGame('duo')">แข่ง 2 คน</button>
  </div>
  <div id="status">กำลังเปิดกล้อง...</div>
</div>

<div id="end" class="card hidden">
  <h1 id="endTitle"></h1>
  <p id="endText"></p>
  <div class="row"><button class="blue" onclick="showStart()">กลับเมนู</button></div>
</div>

<script type="module">
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const ucanvas = document.getElementById('u'), U = ucanvas.getContext('2d');
const video = document.getElementById('video'), statusEl = document.getElementById('status');
const PX = 4, PXU = 2;
const INK = '#000', PAPER = '#1a1340', THAI = 'Kanit,Tahoma,sans-serif';
const P_COLORS = ['#ff5fa2', '#3fb6ff'], P_NAMES = ['ฝั่งซ้าย', 'ฝั่งขวา'];
let W, H;

const LEVELS = [
  {name:'โลก',        g:1.0,  hy:0.42, ground:'#4caf50', under:'#5a3b1e', deco:'grass', planet:'#3f8fff',
   hint:'แรงโน้มถ่วงปกติ ลองกะแรงกับมุมดู!', fact:'แรงโน้มถ่วงของโลกดึงลูกบอลให้ตกลงมาเป็นเส้นโค้ง'},
  {name:'ดวงจันทร์', g:0.3,  hy:0.30, ground:'#b8b8c4', under:'#7a7a88', deco:'crater', planet:'#d9d9e0',
   hint:'แรงโน้มถ่วงน้อยมาก! โยนเบา ๆ ลูกบอลก็ลอยสูง', fact:'บนดวงจันทร์ แรงโน้มถ่วงน้อยกว่าโลกประมาณ 6 เท่า กระโดดได้สูงมาก'},
  {name:'ดาวอังคาร', g:0.55, hy:0.36, ground:'#d9603b', under:'#8a3420', deco:'rock', planet:'#ff7a4f',
   hint:'แรงโน้มถ่วงน้อยกว่าโลก แต่มากกว่าดวงจันทร์', fact:'ดาวอังคารมีแรงโน้มถ่วงประมาณ 1 ใน 3 ของโลก'},
  {name:'ดาวพฤหัสบดี', g:1.8, hy:0.48, ground:'#e0a96d', under:'#a0663a', deco:'band', planet:'#f3d2a8',
   hint:'แรงโน้มถ่วงมหาศาล! ต้องสะบัดแรงสุด ๆ', fact:'ดาวพฤหัสบดีมีแรงโน้มถ่วงมากกว่าโลกเกือบ 2.5 เท่า'},
];
const BALLS = [
  {name:'ปิงปอง', r:0.75, c1:'#ffffff', c2:'#ff9a3d', lines:false},
  {name:'บาสเกตบอล', r:1.0, c1:'#ff8a3d', c2:'#c4521a', lines:true},
  {name:'โบว์ลิ่ง', r:1.15, c1:'#5a4fcf', c2:'#2a2380', holes:true},
];
const SHOTS = 3, READY_LIMIT = 12;

let mode = 'solo', ballType = 1, state = 'menu', players = [], countdown = 0, lastT = 0, lastBeep = 4;
let lv = 0, shot = 0, intro = 0, particles = [], banner = null, shake = 0;

function resize(){
  W = innerWidth; H = innerHeight;
  canvas.width = Math.ceil(W/PX); canvas.height = Math.ceil(H/PX);
  ucanvas.width = Math.ceil(W/PXU); ucanvas.height = Math.ceil(H/PXU);
  ctx.setTransform(1/PX,0,0,1/PX,0,0); U.setTransform(1/PXU,0,0,1/PXU,0,0);
  ctx.imageSmoothingEnabled = false; U.imageSmoothingEnabled = false;
  players.forEach(layoutPlayer);
}
addEventListener('resize', resize);

// ---------- เสียง ----------
let actx = null;
function audio(){ if (!actx) try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch {} return actx; }
function tone(f, d=0.15, type='square', vol=0.1, delay=0, f2=null){
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t+d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + 0.05);
}
function noise(d=0.2, vol=0.15){
  const a = audio(); if (!a) return;
  const b = a.createBuffer(1, a.sampleRate*d, a.sampleRate), ch = b.getChannelData(0);
  for (let i=0;i<ch.length;i++) ch[i] = (Math.random()*2-1) * (1 - i/ch.length);
  const s = a.createBufferSource(), g = a.createGain(); g.gain.value = vol; s.buffer = b; s.connect(g).connect(a.destination); s.start();
}
const sfx = {
  throw: ()=> tone(300, 0.2, 'square', 0.08, 0, 700),
  rim:   ()=> tone(1200, 0.12, 'triangle', 0.12),
  board: ()=> tone(200, 0.1, 'square', 0.12),
  bounce:()=> tone(140, 0.08, 'square', 0.1),
  swish: ()=>{ noise(0.35, 0.18); [784,988,1175,1568].forEach((f,i)=>tone(f,0.15,'square',0.08,0.15+i*0.07)); },
  score: ()=>{ noise(0.2, 0.12); tone(880,0.12,'square',0.08,0.1); tone(1175,0.18,'square',0.08,0.2); },
  miss:  ()=> tone(300, 0.4, 'triangle', 0.1, 0, 150),
  beep:  ()=> tone(520, 0.15, 'square', 0.1),
  go:    ()=> tone(880, 0.35, 'square', 0.12),
  win:   ()=> [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.25,'square',0.1,i*0.12)),
};

// ---------- เมนู ----------
window.setBall = i => { ballType = i; [0,1,2].forEach(k => document.getElementById('ball'+k).classList.toggle('on', k===i)); };
window.showStart = ()=>{
  state = 'menu'; players = [];
  document.getElementById('end').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');
};
window.startGame = m => {
  audio(); mode = m; lv = 0; shot = 0;
  players = mode==='solo' ? [makePlayer(0,0,1)] : [makePlayer(0,0,0.5), makePlayer(1,0.5,1)];
  players.forEach(layoutPlayer);
  particles = []; banner = null; state = 'countdown'; countdown = 3.999; lastBeep = 4;
  document.getElementById('start').classList.add('hidden');
  document.getElementById('end').classList.add('hidden');
};
addEventListener('keydown', e=>{
  if (e.code === 'Space' && state === 'over') showStart();
  if (e.code === 'Escape') showStart();
});

// ---------- ผู้เล่น ----------
function makePlayer(idx, f0, f1){
  return {idx, f0, f1, phase:'wait', score:0, made:0, combo:0, best:0, levelPts:Array(LEVELS.length).fill(0),
          bx:0, by:0, vx:0, vy:0, trail:[], touched:false, touchT:0, hitRim:false, scored:false, flyT:0, bounces:0,
          readyT:0, msg:null, hand:{x:-999,y:-999,seen:false}, hist:[], pts:null};
}
function layoutPlayer(p){
  p.x0 = p.f0*W; p.x1 = p.f1*W; const w = p.x1-p.x0;
  p.br = Math.min(w*0.035, H*0.05) * BALLS[ballType].r;
  p.lx = p.x0 + w*0.16; p.ly = H*0.62; p.groundY = H*0.86;
  p.hx = p.x0 + w*0.74; p.rr = Math.max(p.br*1.7, w*0.035);
  p.hy = H*LEVELS[lv].hy; p.board = p.hx + p.rr + 10;
  p.gpx = H*2.2*LEVELS[lv].g;
}
function resetShot(p){
  layoutPlayer(p);
  p.bx = p.lx; p.by = p.ly; p.vx = p.vy = 0; p.trail = []; p.touched = false; p.hitRim = false; p.scored = false;
  p.flyT = 0; p.bounces = 0; p.crossX = null; p.phase = 'ready'; p.readyT = 0;
}
function beginLevel(){ intro = 3; players.forEach(p => { resetShot(p); p.phase = 'wait'; }); }
function flick(p){ // ความเร็วมือ (vx, vy) จาก 0.1 วินาทีล่าสุด
  const h = p.hist; if (h.length < 2) return null;
  const b = h[h.length-1]; let a = h[0];
  for (let i = h.length-2; i >= 0; i--){ if ((b.t - h[i].t) >= 40){ a = h[i]; break; } }
  const dt = (b.t - a.t)/1000; if (dt < 0.03) return null;
  return {vx:(b.x-a.x)/dt, vy:(b.y-a.y)/dt};
}
function updatePlayer(p, dt, now){
  if (p.hand.seen){ p.hist.push({t: now, x: p.hand.x, y: p.hand.y}); while (p.hist.length && now - p.hist[0].t > 130) p.hist.shift(); } else p.hist = [];
  if (p.phase === 'ready'){
    p.readyT += dt;
    const h = p.hand, d = h.seen ? Math.hypot(h.x-p.bx, h.y-p.by) : 1e9;
    if (d < p.br*2.6){ p.touched = true; p.touchT = 0.35; }
    else if (p.touched){
      p.touchT -= dt;
      const f = flick(p), sp = f ? Math.hypot(f.vx, f.vy) : 0;
      if (f && sp > W*0.35 && f.vx > 0 && f.vy < -sp*0.15){
        const k = 0.62 * Math.sqrt((p.x1-p.x0)/W);
        p.vx = Math.min(f.vx*k, 2600); p.vy = Math.max(f.vy*k, -2600);
        p.phase = 'fly'; sfx.throw(); p.touched = false; p.launch = [Math.round(p.vx), Math.round(p.vy)];
      } else if (p.touchT <= 0) p.touched = false;
    }
    if (p.phase === 'ready' && p.readyT > READY_LIMIT) endShot(p, 0, 'หมดเวลา! แตะลูกบอลแล้วสะบัดมือขึ้นนะ', false);
  } else if (p.phase === 'fly'){
    const steps = 4, sdt = dt/steps;
    for (let s=0; s<steps && p.phase==='fly'; s++) physics(p, sdt);
    p.flyT += dt;
    if (p.flyT % 0.04 < dt) p.trail.push({x:p.bx, y:p.by});
    if (p.trail.length > 60) p.trail.shift();
  } else if (p.phase === 'result'){
    p.resT -= dt; if (p.resT <= 0) p.phase = 'done';
  }
}
function physics(p, dt){
  const prevY = p.by;
  p.vy += p.gpx*dt; p.bx += p.vx*dt; p.by += p.vy*dt;
  // ขอบห่วง 2 จุด
  for (const rx of [p.hx - p.rr, p.hx + p.rr]){
    const dx = p.bx - rx, dy = p.by - p.hy, d = Math.hypot(dx, dy);
    if (d < p.br && d > 0){
      const nx = dx/d, ny = dy/d, vn = p.vx*nx + p.vy*ny;
      p.bx = rx + nx*p.br; p.by = p.hy + ny*p.br;
      if (vn < 0){ p.vx -= 1.6*vn*nx; p.vy -= 1.6*vn*ny; if (!p.hitRim) sfx.rim(); p.hitRim = true; }
    }
  }
  // แป้นบาส
  if (p.bx + p.br > p.board && p.bx < p.board + 20 && p.by > p.hy - p.rr*3.2 && p.by < p.hy + p.br && p.vx > 0){
    p.bx = p.board - p.br; p.vx = -p.vx*0.55; p.hitRim = true; sfx.board();
  }
  if (p.crossX == null && prevY < p.hy && p.by >= p.hy && p.vy > 0) p.crossX = p.bx;
  // ลงห่วง
  if (!p.scored && prevY < p.hy && p.by >= p.hy && p.vy > 0 && p.bx > p.hx - p.rr + p.br*0.4 && p.bx < p.hx + p.rr - p.br*0.4){
    p.scored = true; netT = 0.5;
    const n = p.hitRim ? 2 : 3;
    endShot(p, n, n === 3 ? 'SWISH! ลงห่วงไม่โดนขอบ' : 'ลงห่วง! เยี่ยมมาก', true, true);
  }
  // พื้น
  if (p.by + p.br > p.groundY){
    p.by = p.groundY - p.br; p.vy = -p.vy*0.5; p.vx *= 0.7; p.bounces++; sfx.bounce();
    if (p.bounces >= 2 || Math.abs(p.vy) < 120) missShot(p);
  }
  if (p.bx < p.x0 - 80 || p.bx > p.x1 + 80 || p.flyT > 5) missShot(p);
}
function missShot(p){
  if (p.phase !== 'fly') return;
  const short = p.crossX == null ? p.bx < p.hx : p.crossX < p.hx;
  endShot(p, 0, p.hitRim ? 'โดนขอบ! เกือบลงแล้ว' : short ? 'ยังไม่ถึงห่วง! สะบัดแรงขึ้นอีก' : 'เลยห่วงไป! ลองเบาลงหน่อย', false);
}
let netT = 0;
function endShot(p, n, text, ok, keepFlying=false){
  p.phase = keepFlying ? 'scoredFly' : 'result'; p.resT = 2.2;
  if (n > 0){ p.made++; p.combo++; p.best = Math.max(p.best, p.combo); } else p.combo = 0;
  const bonus = n > 0 && p.combo >= 2 ? 1 : 0;
  p.score += n + bonus; p.levelPts[lv] += n + bonus;
  p.msg = {ok, title: text + (bonus ? `  คอมโบ x${p.combo}` : ''), t: 2.2, n};
  if (n === 3){ sfx.swish(); shake = 0.35; burst(p.hx, p.hy, 50); } else if (n > 0){ sfx.score(); burst(p.hx, p.hy, 25); } else sfx.miss();
  if (keepFlying) setTimeout(()=>{ if (p.phase === 'scoredFly') p.phase = 'result'; }, 700);
}
function burst(x, y, n){
  const cols = ['#ff5fa2','#3fb6ff','#ffcf33','#7be39a','#ffffff'];
  for (let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=200+Math.random()*400; particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-300,c:cols[i%5],life:1.4,g:700}); }
}
function confetti(x0, x1){
  const cols = ['#ff5fa2','#3fb6ff','#ffcf33','#7be39a','#ffffff','#b48cff'];
  for (let i=0;i<220;i++) particles.push({x:x0+Math.random()*(x1-x0), y:-20-Math.random()*H*0.5, vx:(Math.random()-0.5)*120, vy:100+Math.random()*200, c:cols[i%6], life:3.5, slow:true});
}
function advance(){
  if (state !== 'play' || !players.every(p => p.phase === 'done' || p.phase === 'wait')) return;
  if (shot + 1 < SHOTS){ shot++; players.forEach(resetShot); return; }
  shot = 0;
  if (lv + 1 >= LEVELS.length){ players.forEach(p => p.phase = 'end'); endGame(); return; }
  lv++; beginLevel();
}

// ---------- จบเกม ----------
function endGame(){
  state = 'over'; sfx.win();
  const max = LEVELS.length*SHOTS;
  const facts = `<br><span style="font-size:.85em">จำไว้นะ: แรงโน้มถ่วงดึงของให้ตกลงพื้น · ดาวแต่ละดวงมีแรงโน้มถ่วงไม่เท่ากัน · ${BALLS[ballType].name}ตกเร็วเท่าลูกอื่น ถ้าไม่มีลมต้าน ของหนักกับของเบาตกเร็วเท่ากัน!</span>`;
  const row = p => LEVELS.map((L,i)=>`${L.name} ${p.levelPts[i]}`).join(' · ');
  if (mode === 'solo'){
    const p = players[0]; confetti(0, W);
    const title = p.made >= 10 ? 'เทพชู้ตแห่งจักรวาล!' : p.made >= 7 ? 'นักชู้ตระดับดาวเด่น!' : p.made >= 4 ? 'นักชู้ตฝีมือดี!' : 'นักชู้ตฝึกหัด!';
    setTimeout(()=>{
      pixelTitle(document.getElementById('endTitle'), title);
      document.getElementById('endText').innerHTML = `ชู้ตลง <b>${p.made}</b> จาก ${max} ลูก · ได้ ${p.score} คะแนน · คอมโบสูงสุด x${p.best}<br>${row(p)}${facts}`;
      document.getElementById('end').classList.remove('hidden');
    }, 1200);
    return;
  }
  const [a, b] = players;
  const w = a.score > b.score ? a : b.score > a.score ? b : null;
  if (w){ confetti(w.x0, w.x1); banner = {p: w}; } else confetti(0, W);
  setTimeout(()=>{
    pixelTitle(document.getElementById('endTitle'), w ? `${P_NAMES[w.idx]}ชนะ!` : 'เสมอกัน! เก่งทั้งคู่', w ? P_COLORS[w.idx] : '#ffcf33');
    const line = p => `<b style="color:${P_COLORS[p.idx]}">${P_NAMES[p.idx]}</b> ${p.score} คะแนน (ลง ${p.made} ลูก)<br><span style="font-size:.8em">${row(p)}</span>`;
    document.getElementById('endText').innerHTML = `${line(a)}<br>${line(b)}${facts}`;
    document.getElementById('end').classList.remove('hidden');
  }, 2000);
}

// ---------- จับมือ ----------
let handOK = false, landmarker = null, lastVideoTime = -1;
addEventListener('mousemove', e=>{
  if (handOK || !players.length) return;
  const p = players.find(p => e.clientX >= p.x0 && e.clientX < p.x1) || players[0];
  players.forEach(q => { if (q !== p) q.hand.seen = false; });
  p.hand.x = e.clientX; p.hand.y = e.clientY; p.hand.seen = true;
});
async function initHands(){
  try{
    video.srcObject = await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720,facingMode:'user'}});
    await video.play();
    statusEl.textContent = 'เปิดกล้องแล้ว กำลังโหลดตัวจับมือ...';
    const {FilesetResolver, HandLandmarker} = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fs = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opts = d => ({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate:d}, runningMode:'VIDEO', numHands:2});
    try { landmarker = await HandLandmarker.createFromOptions(fs, opts('GPU')); }
    catch { landmarker = await HandLandmarker.createFromOptions(fs, opts('CPU')); }
    handOK = true;
    statusEl.textContent = 'พร้อมเล่น! ยืนห่างกล้องประมาณ 1–1.5 เมตร แล้วยกมือขึ้น';
  }catch(err){
    console.error(err);
    statusEl.textContent = 'เปิดกล้องหรือตัวจับมือไม่ได้ ตอนนี้เล่นด้วยเมาส์ได้ · ตรวจว่าอนุญาตกล้องและต่ออินเทอร์เน็ต';
  }
}
const mapPt = p => ({x:(1-(0.5+(p.x-0.5)*1.4))*W, y:(0.5+(p.y-0.5)*1.4)*H});
function trackHands(){
  if (!handOK || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const r = landmarker.detectForVideo(video, performance.now());
  const found = (r.landmarks || []).map(L => ({pts: L.map(mapPt), c: mapPt({x:(L[0].x+L[9].x)/2, y:(L[0].y+L[9].y)/2})}));
  const assigned = players.map(()=>null);
  if (mode === 'solo'){ if (found[0]) assigned[0] = found[0]; }
  else for (const f of found){ const side = f.c.x < W/2 ? 0 : 1; if (!assigned[side]) assigned[side] = f; }
  players.forEach((p,i)=>{
    const f = assigned[i];
    if (!f){ p.hand.seen = false; p.pts = null; return; }
    p.pts = f.pts;
    p.hand.x = p.hand.seen ? p.hand.x + (f.c.x-p.hand.x)*0.7 : f.c.x;
    p.hand.y = p.hand.seen ? p.hand.y + (f.c.y-p.hand.y)*0.7 : f.c.y;
    p.hand.seen = true;
  });
}

// ---------- วาด ----------
function sticker(x,y,w,h,fill,sh=6){
  const ctx = U;
  ctx.fillStyle='#000'; ctx.fillRect(x-4+sh,y-4+sh,w+8,h+8);
  ctx.fillStyle='#000'; ctx.fillRect(x-8,y-8,w+16,h+16);
  ctx.fillStyle='#fff'; ctx.fillRect(x-4,y-4,w+8,h+8);
  ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);
}
function label(t, x, y, size, fill='#fff'){
  const ctx = U;
  ctx.font = `800 ${size}px ${/^[0-9A-Za-z!?\sx/.]+$/.test(t) ? '"Press Start 2P",' : ''}${THAI}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'miter';
  ctx.lineWidth = Math.max(6, size*0.28); ctx.strokeStyle = INK; ctx.strokeText(t, x, y);
  ctx.fillStyle = fill; ctx.fillText(t, x, y);
}
function pixStar(x, y, s, on){
  const ctx = U, m = ['..#..','.###.','#####','.###.','#.#.#'], c = s/5;
  ctx.fillStyle = '#000'; ctx.fillRect(x-s/2-3, y-s/2-3, s+6, s+6);
  ctx.fillStyle = '#3a2f7a'; ctx.fillRect(x-s/2, y-s/2, s, s);
  ctx.fillStyle = on ? '#ffcf33' : '#6a5fae';
  m.forEach((row,j)=>[...row].forEach((ch,i)=>{ if (ch==='#') ctx.fillRect(x-s/2+i*c, y-s/2+j*c, c, c); }));
}
function drawBG(t){
  if (handOK && video.videoWidth){
    const vw=video.videoWidth, vh=video.videoHeight, s=Math.max(W/vw,H/vh);
    ctx.save(); ctx.translate(W,0); ctx.scale(-1,1);
    ctx.drawImage(video,(W-vw*s)/2,(H-vh*s)/2,vw*s,vh*s); ctx.restore();
  } else {
    ctx.fillStyle='#120c33'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff'; for (let i=0;i<60;i++){ const x=(i*197)%W, y=(i*113)%(H*0.7); ctx.globalAlpha = (Math.sin(t/400+i)>0)?0.9:0.3; ctx.fillRect(x,y,i%3?4:8,i%3?4:8); }
    ctx.globalAlpha = 1;
  }
}
function drawWorld(p, t){
  const L = LEVELS[lv], gy = p.groundY;
  // ดาวเคราะห์ประจำด่านลอยมุมจอ
  const pr = Math.min(p.x1-p.x0, H)*0.07, px = p.x0 + (p.x1-p.x0)*0.42, py = H*0.2;
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(px, py, pr+6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = L.planet; ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(px-pr*0.5, py-pr*0.5, pr*0.3, pr*0.3);
  if (lv === 0){ ctx.fillStyle = '#4caf50'; ctx.fillRect(px-pr*0.4, py-pr*0.1, pr*0.5, pr*0.35); ctx.fillRect(px+pr*0.2, py+pr*0.25, pr*0.35, pr*0.25); }
  if (lv === 3){ ctx.fillStyle = 'rgba(160,90,40,.6)'; ctx.fillRect(px-pr, py-pr*0.2, pr*2, pr*0.15); ctx.fillRect(px-pr, py+pr*0.25, pr*2, pr*0.15); }
  // พื้น
  ctx.fillStyle = INK; ctx.fillRect(p.x0, gy-8, p.x1-p.x0, H);
  ctx.fillStyle = L.ground; ctx.fillRect(p.x0, gy, p.x1-p.x0, 24);
  ctx.fillStyle = L.under; ctx.fillRect(p.x0, gy+24, p.x1-p.x0, H);
  if (L.deco==='grass'){ ctx.fillStyle='#2e7d32'; for (let x=p.x0+8; x<p.x1; x+=24) ctx.fillRect(x, gy-8, 6, 10); }
  if (L.deco==='crater'){ ctx.fillStyle='#8a8a98'; for (let x=p.x0+30; x<p.x1; x+=120){ ctx.fillRect(x, gy+4, 40, 8); ctx.fillRect(x+8, gy+12, 24, 6); } }
  if (L.deco==='rock'){ ctx.fillStyle='#8a3420'; for (let x=p.x0+20; x<p.x1; x+=90) ctx.fillRect(x, gy-12, 20, 14); }
  if (L.deco==='band'){ ctx.fillStyle='#c98a50'; ctx.fillRect(p.x0, gy+10, p.x1-p.x0, 6); }
  // เสา + แป้น + ห่วง
  const pole = p.board + 14;
  ctx.fillStyle = INK; ctx.fillRect(pole-6, p.hy - p.rr*3.4, 20, gy - (p.hy - p.rr*3.4));
  ctx.fillStyle = '#9a9aa8'; ctx.fillRect(pole-2, p.hy - p.rr*3.4, 12, gy - (p.hy - p.rr*3.4));
  ctx.fillStyle = INK; ctx.fillRect(p.board-4, p.hy - p.rr*3.4, 20, p.rr*3.4 + 16);
  ctx.fillStyle = '#fff'; ctx.fillRect(p.board, p.hy - p.rr*3.2, 12, p.rr*3.2 + 8);
  ctx.fillStyle = '#ff4f4f'; ctx.fillRect(p.board, p.hy - p.rr*1.6, 12, 6);
  // ตาข่าย
  const nw = netT > 0 && players.some(q => q.scored) ? Math.sin(t/40)*6 : 0;
  ctx.fillStyle = '#fff';
  for (let i=0;i<5;i++){ const yy = p.hy + 8 + i*p.rr*0.22, inset = i*p.rr*0.1;
    for (let x = p.hx - p.rr + inset; x <= p.hx + p.rr - inset; x += p.rr*0.33) ctx.fillRect(x + (i%2?nw:-nw), yy, 6, 6); }
  ctx.fillStyle = INK; ctx.fillRect(p.hx - p.rr - 6, p.hy - 6, p.rr*2 + 12, 16);
  ctx.fillStyle = '#ff6b2d'; ctx.fillRect(p.hx - p.rr, p.hy - 2, p.rr*2, 8);
  ctx.fillStyle = INK; ctx.fillRect(p.hx + p.rr, p.hy - 6, p.board - p.hx - p.rr, 12);
  // เส้นทางลูกบอล
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  p.trail.forEach((q,i)=>{ if (i%2===0) ctx.fillRect(q.x-4, q.y-4, 8, 8); });
  // จุดปล่อย + ลูกศรใบ้
  if (p.phase === 'ready'){
    const k = (Math.floor(t/150)%4)*10;
    ctx.fillStyle = '#ffcf33';
    for (let i=0;i<3;i++){ const ax = p.lx + p.br*1.6 + i*30 + k, ay = p.ly - p.br*1.6 - i*30 - k; ctx.fillRect(ax, ay, 14, 14); }
    ctx.strokeStyle = p.touched ? '#7be39a' : 'rgba(255,255,255,.7)'; ctx.lineWidth = 8; ctx.setLineDash([12,10]);
    ctx.strokeRect(p.lx - p.br*2.2, p.ly - p.br*2.2, p.br*4.4, p.br*4.4); ctx.setLineDash([]);
  }
}
function drawBall(p, t){
  if (p.phase === 'wait' || p.phase === 'end') return;
  const b = BALLS[ballType], r = p.br, x = p.bx, y = p.by;
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x, y, r+6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = b.c2; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = b.c1; ctx.beginPath(); ctx.arc(x - r*0.15, y - r*0.15, r*0.78, 0, Math.PI*2); ctx.fill();
  if (b.lines){ ctx.fillStyle = INK; ctx.fillRect(x - r, y - 2, r*2, 5); ctx.fillRect(x - 2, y - r, 5, r*2); }
  if (b.holes){ ctx.fillStyle = INK; ctx.fillRect(x - r*0.3, y - r*0.4, 7, 7); ctx.fillRect(x, y - r*0.5, 7, 7); ctx.fillRect(x - r*0.05, y - r*0.15, 7, 7); }
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillRect(x - r*0.55, y - r*0.55, r*0.25, r*0.25);
}
const BONES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawHand(p){
  if (!p.hand.seen) return;
  const col = mode==='duo' ? P_COLORS[p.idx] : '#8fe9ff';
  if (p.pts){
    ctx.lineCap='square';
    ctx.strokeStyle=INK; ctx.lineWidth=12; for (const [a,b] of BONES){ ctx.beginPath(); ctx.moveTo(p.pts[a].x,p.pts[a].y); ctx.lineTo(p.pts[b].x,p.pts[b].y); ctx.stroke(); }
    ctx.strokeStyle=col; ctx.lineWidth=6; for (const [a,b] of BONES){ ctx.beginPath(); ctx.moveTo(p.pts[a].x,p.pts[a].y); ctx.lineTo(p.pts[b].x,p.pts[b].y); ctx.stroke(); }
    ctx.fillStyle='#fff'; for (const q of p.pts) ctx.fillRect(q.x-5,q.y-5,10,10);
  }
  const r = Math.min(W,H)*0.045, hx = p.hand.x, hy = p.hand.y;
  ctx.fillStyle=INK; ctx.fillRect(hx-r-6, hy-r-6, r*2+12, 14); ctx.fillRect(hx-r-6, hy+r-8, r*2+12, 14); ctx.fillRect(hx-r-6, hy-r-6, 14, r*2+12); ctx.fillRect(hx+r-8, hy-r-6, 14, r*2+12);
  ctx.fillStyle = p.touched ? '#7be39a' : col; ctx.fillRect(hx-r-2, hy-r-2, r*2+4, 6); ctx.fillRect(hx-r-2, hy+r-4, r*2+4, 6); ctx.fillRect(hx-r-2, hy-r-2, 6, r*2+4); ctx.fillRect(hx+r-4, hy-r-2, 6, r*2+4);
}
function drawHUD(p){
  const ctx = U, f = Math.max(17, Math.min(W,H)*0.036), L = LEVELS[lv];
  ctx.font = `800 ${f}px ${THAI}`; ctx.textBaseline='middle'; ctx.textAlign='left';
  const txt = mode==='solo' ? `${L.name}  ด่าน ${lv+1}/4   ลูกที่ ${shot+1}/${SHOTS}   คะแนน ${p.score}` : `${P_NAMES[p.idx]}  ${p.score}`;
  const w = ctx.measureText(txt).width + 36, x = p.idx===1 ? p.x1-16-w-8 : p.x0+16;
  sticker(x, 16, w, f*1.7, mode==='duo' ? P_COLORS[p.idx] : PAPER);
  ctx.fillStyle = mode==='duo' ? '#000' : '#fff'; ctx.fillText(txt, x+18, 16+f*0.85);
  if (mode==='duo'){
    ctx.font = `800 ${f*0.75}px ${THAI}`; const t2 = `${L.name} · ลูกที่ ${shot+1}/${SHOTS}`, w2 = ctx.measureText(t2).width + 24;
    const x2 = p.idx===1 ? p.x1-16-w2-8 : p.x0+16; sticker(x2, 16+f*1.7+18, w2, f*1.15, PAPER);
    ctx.fillStyle='#fff'; ctx.fillText(t2, x2+12, 16+f*1.7+18+f*0.58);
  }
  if (p.combo >= 2){
    ctx.font = `800 ${f*0.85}px ${THAI}`;
    const ct = `คอมโบ x${p.combo}`, cw = ctx.measureText(ct).width + 24;
    const cx = p.idx===1 ? p.x1-16-cw-8 : p.x0+16, cy = 16 + f*1.7 + 18 + (mode==='duo' ? f*1.15+18 : 0);
    sticker(cx, cy, cw, f*1.2, '#ffcf33'); ctx.fillStyle = '#000'; ctx.fillText(ct, cx+12, cy+f*0.6);
  }
}
function drawDuoMiddle(){
  const ctx = U;
  ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.setLineDash([14,12]);
  ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);
  label('VS', W/2, H*0.5, Math.min(W,H)*0.07, '#ffcf33');
}
function drawMsg(p, dt){
  const m = p.msg; if (!m) return;
  m.t -= dt; if (m.t <= 0){ p.msg = null; return; }
  const ctx = U, pw = p.x1-p.x0, f = Math.max(18, Math.min(pw, H*1.6)*(mode==='solo'?0.032:0.034));
  const w = Math.min(pw*0.85, 900), h = f*3.6, x = p.x0 + (pw-w)/2, y = H*0.27;
  ctx.globalAlpha = Math.min(1, m.t*2);
  sticker(x, y, w, h, PAPER);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`800 ${f}px ${THAI}`; ctx.fillStyle = m.ok ? '#7be39a' : '#ff6b5e';
  ctx.fillText(m.title, x+w/2, y+f*1.0, w-24);
  const ss = f*1.3; for (let k=0;k<3;k++) pixStar(x+w/2 + (k-1)*(ss+12), y+f*2.5, ss, m.n > k);
  ctx.globalAlpha = 1;
}
function drawIntro(dt){
  intro -= dt;
  const L = LEVELS[lv], f = Math.min(W,H)*0.04, w = Math.min(W*0.8, 900), h = f*5.4, x = (W-w)/2, y = H*0.2;
  sticker(x, y, w, h, PAPER);
  label(`ด่าน ${lv+1}: ${L.name}`, W/2, y+f*1.3, f*1.5, '#ffcf33');
  const ctx = U; ctx.font = `800 ${f*0.85}px ${THAI}`; ctx.fillStyle='#fff'; ctx.textAlign='center';
  ctx.fillText(L.hint, W/2, y+f*3.0, w-30);
  ctx.font = `${f*0.7}px ${THAI}`; ctx.fillStyle='#a9a2d6'; ctx.fillText(L.fact, W/2, y+f*4.3, w-30);
  if (intro <= 0) players.forEach(resetShot);
}
function drawParticles(dt){
  for (const p of particles){
    if (p.slow){ p.vx += (Math.random()-0.5)*40*dt; p.vy = Math.min(p.vy + 40*dt, 260); } else p.vy += (p.g||900)*dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*(p.slow?0.6:1.3);
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.fillStyle = p.c;
    ctx.fillRect(Math.round(p.x/4)*4, Math.round(p.y/4)*4, 12, 12);
  }
  ctx.globalAlpha = 1; particles = particles.filter(p => p.life > 0 && p.y < H+40);
}
function drawCountdown(dt){
  countdown -= dt;
  const n = Math.ceil(countdown);
  if (n !== lastBeep && n >= 1){ sfx.beep(); lastBeep = n; }
  if (countdown <= 0){ sfx.go(); state = 'play'; beginLevel(); return; }
  const frac = countdown - Math.floor(countdown);
  label(String(n), W/2, H*0.36, Math.min(W,H)*(0.2 + 0.07*frac), '#ffcf33');
  label(mode==='duo' ? 'ยืนคนละฝั่ง แล้วยกมือขึ้น!' : 'เตรียมชู้ต! ยกมือขึ้นเลย', W/2, H*0.55, Math.min(W,H)*0.05);
}
function drawWinner(){
  if (!banner || !banner.p) return;
  const p = banner.p, s = 1 + Math.sin(performance.now()/180)*0.06;
  label('ชนะ!', (p.x0+p.x1)/2, H*0.36, Math.min(W,H)*0.16*s, P_COLORS[p.idx]);
}

function loop(t){
  const dt = Math.min(0.05, (t-lastT)/1000 || 0); lastT = t;
  netT = Math.max(0, netT - dt);
  trackHands(); U.clearRect(0,0,W,H);
  const sh = shake > 0 ? (Math.random()-0.5)*shake*40 : 0; shake = Math.max(0, shake - dt);
  ctx.setTransform(1/PX,0,0,1/PX,sh/PX,0);
  drawBG(t);
  if (state !== 'menu' && players.length){
    if (state === 'play' && intro <= 0){
      players.forEach(p => { updatePlayer(p, dt, t); if (p.phase === 'scoredFly'){ const st = 4; for (let i=0;i<st;i++){ p.vy += p.gpx*dt/st; p.bx += p.vx*dt/st; p.by += p.vy*dt/st; } } });
      advance();
    }
    players.forEach(p => drawWorld(p, t));
    players.forEach(p => drawBall(p, t));
    if (mode === 'duo') drawDuoMiddle();
    players.forEach(drawHUD);
    players.forEach(p => drawMsg(p, dt));
    if (state === 'countdown') drawCountdown(dt);
    if (state === 'play' && intro > 0) drawIntro(dt);
    drawWinner();
  }
  drawParticles(dt);
  players.forEach(drawHand);
  requestAnimationFrame(loop);
}
function pixelTitle(el, text, color='#ffcf33'){
  const sz = 22, c = document.createElement('canvas'), x = c.getContext('2d');
  x.font = `800 ${sz}px ${THAI}`;
  c.width = Math.ceil(x.measureText(text).width) + 12; c.height = sz*1.7;
  x.font = `800 ${sz}px ${THAI}`; x.textBaseline = 'middle'; x.lineJoin = 'miter';
  x.lineWidth = 6; x.strokeStyle = '#000'; x.strokeText(text, 6, c.height/2+2);
  x.fillStyle = color; x.fillText(text, 6, c.height/2+2);
  const scale = Math.min(3, (Math.min(innerWidth*0.82, 820)) / c.width);
  c.style.width = c.width*scale + 'px'; c.style.height = c.height*scale + 'px';
  el.innerHTML = ''; el.appendChild(c);
}
window.__p = () => ({players, lv, shot, intro, state});
document.fonts.ready.then(()=> pixelTitle(document.querySelector('#start h1'), 'ชู้ตเทพแรงโน้มถ่วง!', '#ff8a3d'));
resize(); initHands(); requestAnimationFrame(loop);
</script>
